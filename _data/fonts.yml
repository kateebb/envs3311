# Font choices for _config.yml -> style: font / heading_font
# "google" is the Google Fonts family spec (blank = no download needed).
system:
  google: ""
  stack: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
inter:
  google: "Inter:wght@400;600;700"
  stack: '"Inter", system-ui, sans-serif'
source-sans:
  google: "Source+Sans+3:wght@400;600;700"
  stack: '"Source Sans 3", system-ui, sans-serif'
lato:
  google: "Lato:wght@400;700"
  stack: '"Lato", system-ui, sans-serif'
nunito:
  google: "Nunito+Sans:wght@400;600;700"
  stack: '"Nunito Sans", system-ui, sans-serif'
merriweather:
  google: "Merriweather:wght@400;700"
  stack: '"Merriweather", Georgia, serif'
source-serif:
  google: "Source+Serif+4:wght@400;600;700"
  stack: '"Source Serif 4", Georgia, serif'
lora:
  google: "Lora:wght@400;600;700"
  stack: '"Lora", Georgia, serif'
georgia:
  google: ""
  stack: 'Georgia, "Times New Roman", serif'
